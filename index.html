<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MoneyFlow</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1a1a2e;--muted:#8e8e93;--border:#e5e5ea;--blue:#5B9BD5;--green:#34C759;--red:#FF3B30;--purple:#7B52AB;--th:54px;--bh:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
.hdr{position:fixed;top:0;left:0;right:0;height:var(--th);background:var(--card);border-bottom:.5px solid var(--border);display:flex;align-items:center;padding:0 16px;z-index:100}
.hdr-t{font-size:17px;font-weight:600;flex:1;text-align:center}
.hdr-r{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:2px;cursor:pointer}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:var(--bh);background:var(--card);border-top:.5px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);font-size:9px;transition:color .15s}
.tb.on{color:var(--blue)}
.tb i{font-size:21px}
.pg{display:none;position:fixed;top:var(--th);bottom:var(--bh);left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg.on{display:block}
.wrap{padding:16px 16px 24px}
/* BALANCE */
.bal{background:var(--blue);border-radius:20px;padding:20px;color:#fff;margin-bottom:14px}
.bal-l{font-size:12px;opacity:.85;margin-bottom:4px}
.bal-n{font-size:32px;font-weight:700;margin-bottom:14px;letter-spacing:-.5px}
.bal-row{display:flex;gap:10px}
.bal-s{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:10px 12px}
.bal-sl{font-size:11px;opacity:.85;margin-bottom:2px}
.bal-sv{font-size:15px;font-weight:600}
.qb{display:flex;gap:10px;margin-bottom:14px}
.qb-e{flex:1;background:var(--red);color:#fff;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.qb-i{flex:1;background:var(--green);color:#fff;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.acg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.acard{background:var(--card);border-radius:14px;padding:12px}
.ae{font-size:22px;margin-bottom:4px}
.an{font-size:11px;color:var(--muted)}
.av{font-size:15px;font-weight:600;margin-top:2px}
.txl{display:flex;flex-direction:column;gap:8px}
.txi{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.txic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.txic.r{background:#FFF0F0}
.txic.g{background:#F0FFF4}
.txif{flex:1;min-width:0}
.txin{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txim{font-size:11px;color:var(--muted);margin-top:1px}
.txic2{font-size:11px;color:var(--muted);margin-top:2px;font-style:italic}
.txa{font-size:14px;font-weight:600;flex-shrink:0}
.txa.neg{color:var(--red)}
.txa.pos{color:var(--green)}
.delbtn{background:#FFF0F0;border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* ADD */
.ttabs{display:flex;background:#f0f0f0;border-radius:12px;padding:3px;margin-bottom:14px}
.ttab{flex:1;padding:8px;text-align:center;font-size:13px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;transition:all .15s}
.ttab.exp{background:var(--red);color:#fff}
.ttab.inc{background:var(--green);color:#fff}
.amti{width:100%;text-align:center;font-size:36px;font-weight:700;border:none;background:transparent;color:var(--text);outline:none}
.cur-row{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.cb{padding:6px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;background:var(--card);cursor:pointer;color:var(--muted);font-weight:500;transition:all .15s}
.cb.on{border-color:var(--blue);color:var(--blue);background:#EEF4FF}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-bottom:12px}
.ratebox{display:none;align-items:center;gap:8px;justify-content:center;margin-bottom:12px}
.rateinp{width:130px;border:1.5px solid var(--blue);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:600;outline:none;text-align:center;color:var(--text)}
.fsec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.catl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.catr{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 14px;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.catr.se{border-color:var(--red);background:#FFF5F5}
.catr.si{border-color:var(--green);background:#F5FFF7}
.catem{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.catnm{font-size:15px;flex:1}
.catchk{font-size:20px;display:none}
.catr.se .catchk{display:block;color:var(--red)}
.catr.si .catchk{display:block;color:var(--green)}
.addcat{display:flex;align-items:center;gap:12px;background:#EEF4FF;border:1.5px dashed var(--blue);border-radius:14px;padding:11px 14px;cursor:pointer}
.addcati{width:30px;height:30px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.accl{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.accr{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:11px 14px;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.accr.on{border-color:var(--blue);background:#EEF4FF}
.accrchk{color:var(--blue);font-size:20px;display:none;margin-left:auto}
.accr.on .accrchk{display:block}
.accri{flex:1}
.accrnm{font-size:15px;font-weight:500}
.accrsb{font-size:12px;color:var(--muted)}
.cominp{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--text);outline:none;margin-bottom:14px;font-family:inherit}
.cominp:focus{border-color:var(--blue)}
.savebtn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer}
/* STATS */
.statnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.statnb{background:var(--card);border:none;border-radius:10px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--blue)}
.statlbl{font-size:16px;font-weight:600}
.statsum{display:flex;gap:8px;margin-bottom:14px}
.statsc{flex:1;background:var(--card);border-radius:14px;padding:10px;text-align:center}
.statsl{font-size:10px;color:var(--muted);margin-bottom:3px}
.statsv{font-size:15px;font-weight:700}
.statsv.neg{color:var(--red)}
.statsv.pos{color:var(--green)}
.statsv.neu{color:var(--blue)}
.statcat{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.statcath{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.statcatn{font-size:14px;font-weight:500}
.statcatv{font-size:14px;font-weight:600}
.barbg{background:#f0f0f0;border-radius:6px;height:6px;overflow:hidden}
.barfill{height:100%;border-radius:6px;transition:width .5s}
/* HISTORY */
.hfil{display:flex;gap:8px;margin-bottom:14px}
.hfbtn{flex:1;padding:8px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.hfbtn.exp-on{border-color:var(--red);background:#FFF0F0;color:var(--red)}
.hfbtn.inc-on{border-color:var(--green);background:#F0FFF4;color:var(--green)}
.hfbtn.all-on{border-color:var(--blue);background:#EEF4FF;color:var(--blue)}
.morebtn{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px;font-size:14px;color:var(--blue);font-weight:600;cursor:pointer;margin-top:8px}
/* SAVINGS */
.savhero{background:var(--purple);border-radius:20px;padding:20px;color:#fff;margin-bottom:14px}
.savhl{font-size:12px;opacity:.85;margin-bottom:4px}
.savhn{font-size:32px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px}
.savhs{font-size:13px;opacity:.8}
.goalc{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.goalh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.goalem{font-size:26px}
.goali{flex:1}
.goalnm{font-size:15px;font-weight:600}
.goalpt{font-size:12px;color:var(--muted);margin-top:2px}
.goalpct{font-size:16px;font-weight:700;color:var(--purple)}
.goalbar{background:#f0f0f0;border-radius:8px;height:8px;margin-bottom:12px;overflow:hidden}
.goalbf{height:100%;border-radius:8px;background:var(--purple);transition:width .5s}
.goalacts{display:flex;gap:8px}
.gbtn{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer}
.gbtn-a{background:#F0FFF4;color:var(--green)}
.gbtn-t{background:#FFF0F0;color:var(--red)}
.addgoal{width:100%;background:var(--card);border:2px dashed var(--purple);border-radius:16px;padding:14px;font-size:15px;color:var(--purple);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.surpcard{border-radius:16px;padding:14px;margin-bottom:14px}
/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:flex-end}
.mbg.on{display:flex}
.mbox{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:75vh;overflow-y:auto}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mtitle{font-size:17px;font-weight:600}
.mclose{background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.marc{display:flex;align-items:center;gap:12px;background:#f8f8f8;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--bh) + 14px);left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:32px 20px;color:var(--muted)}
.empty i{font-size:44px;margin-bottom:10px;display:block}
</style>
</head>
<body>

<div class="hdr">
  <div style="width:50px"></div>
  <div class="hdr-t">💰 MoneyFlow</div>
  <div class="hdr-r" id="hdrM"></div>
</div>

<div class="pg on" id="pg-home"><div class="wrap" id="homeEl"><div class="spin"></div></div></div>

<div class="pg" id="pg-add">
  <div class="wrap">
    <div style="background:var(--card);border-radius:16px;padding:16px">
      <div class="ttabs">
        <div class="ttab exp" id="ttE" onclick="setType('expense')">🔴 Расход</div>
        <div class="ttab" id="ttI" onclick="setType('income')">🟢 Доход</div>
      </div>
      <input class="amti" type="number" id="amtIn" placeholder="0" inputmode="decimal">
      <div class="cur-row">
        <button class="cb on" onclick="setCur(this,'UAH')">грн</button>
        <button class="cb" onclick="setCur(this,'EUR')">€ EUR</button>
        <button class="cb" onclick="setCur(this,'USD')">$ USD</button>
        <button class="cb" onclick="setCur(this,'GBP')">£ GBP</button>
      </div>
      <div class="hint" id="hintEl">Сумма в гривнах</div>
      <div class="ratebox" id="rateBox">
        <span id="rateLabel" style="font-size:14px;color:var(--muted)">1 € =</span>
        <input class="rateinp" type="number" id="rateIn" placeholder="курс">
        <span style="font-size:14px;color:var(--muted)">грн</span>
      </div>
      <div class="fsec">Категория</div>
      <div class="catl" id="catEl"></div>
      <div class="fsec">Счёт</div>
      <div class="accl" id="accEl"></div>
      <input class="cominp" type="text" id="comIn" placeholder="Комментарий (необязательно)">
      <button class="savebtn" onclick="saveTx()">Сохранить</button>
    </div>
  </div>
</div>

<div class="pg" id="pg-stats"><div class="wrap" id="statsEl"><div class="spin"></div></div></div>
<div class="pg" id="pg-hist"><div class="wrap" id="histEl"><div class="spin"></div></div></div>
<div class="pg" id="pg-sav"><div class="wrap" id="savEl"><div class="spin"></div></div></div>

<div class="tabbar">
  <div class="tb on" id="tb-home" onclick="go('home')"><i class="ti ti-home"></i>Главная</div>
  <div class="tb" id="tb-add" onclick="go('add')"><i class="ti ti-plus-circle"></i>Добавить</div>
  <div class="tb" id="tb-stats" onclick="go('stats')"><i class="ti ti-chart-pie"></i>Статистика</div>
  <div class="tb" id="tb-hist" onclick="go('hist')"><i class="ti ti-list"></i>История</div>
  <div class="tb" id="tb-sav" onclick="go('sav')"><i class="ti ti-piggy-bank"></i>Накопления</div>
</div>

<div class="mbg" id="mbg">
  <div class="mbox" id="mbox"></div>
</div>
<div class="toast" id="toastEl"></div>

<script>
var sb = supabase.createClient(
  'https://xplmowdaqmxfefezirvy.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwbG1vd2RhcW14ZmVmZXppcnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MDM0NzEsImV4cCI6MjA5Mzk3OTQ3MX0.sxF8EJyCS32jrcKGbMEvK0YdtXk80twifnx3qUdjLWU'
);
var tg = window.Telegram && window.Telegram.WebApp;
var OWNER = 288578366;

function checkAuth() {
  if (!tg) return true;
  var uid = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
  if (uid && uid !== OWNER) {
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px;text-align:center"><div style="font-size:72px;margin-bottom:20px">🔒</div><div style="font-size:22px;font-weight:700;margin-bottom:10px">Доступ закрыт</div><div style="font-size:15px;color:#8e8e93">Открой из своего Telegram</div></div>';
    return false;
  }
  return true;
}
if (tg) { tg.ready(); tg.expand(); }

var txType = 'expense';
var selCat = null;
var selAcc = null;
var selCur = 'UAH';
var statMonth = new Date();
statMonth.setDate(1);
var histOffset = 0;
var histLimit = 30;
var histFilter = 'all';
var histDone = false;
var modalCb = null;
var cmGoals = null;
var cmSurplus = 0;

function fmt(n) { return Number(n).toLocaleString('uk-UA', {maximumFractionDigits:0}) + ' грн'; }
function fmtD(d) { return new Date(d).toLocaleDateString('ru-RU', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function monthRange(d) {
  var y = d.getFullYear(), m = d.getMonth();
  return {
    from: new Date(y,m,1).toISOString(),
    to: new Date(y,m+1,0,23,59,59).toISOString()
  };
}

function go(name) {
  document.querySelectorAll('.pg').forEach(function(p){ p.classList.remove('on'); });
  document.querySelectorAll('.tb').forEach(function(t){ t.classList.remove('on'); });
  document.getElementById('pg-'+name).classList.add('on');
  document.getElementById('tb-'+name).classList.add('on');
  if (name==='home') loadHome();
  if (name==='add') loadAdd();
  if (name==='stats') loadStats();
  if (name==='hist') loadHist(true);
  if (name==='sav') loadSav();
}

function toast(msg) {
  var t = document.getElementById('toastEl');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2500);
}

function showModal(title, html, cb) {
  modalCb = cb || null;
  document.getElementById('mbox').innerHTML =
    '<div class="mhdr"><div class="mtitle">'+title+'</div><button class="mclose" onclick="closeModal()">×</button></div>' + html;
  document.getElementById('mbg').classList.add('on');
}
function closeModal() { document.getElementById('mbg').classList.remove('on'); }
document.getElementById('mbg').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
function mpick(id) { closeModal(); if(modalCb) modalCb(id); }

// ── HOME ────────────────────────────────────────────────
function loadHome() {
  var el = document.getElementById('homeEl');
  el.innerHTML = '<div class="spin"></div>';
  var now = new Date();
  var r = monthRange(now);
  document.getElementById('hdrM').innerHTML = now.toLocaleDateString('ru-RU',{month:'long'}) + ' <i class="ti ti-chevron-right" style="font-size:12px"></i>';
  Promise.all([
    sb.from('accounts').select('*').order('id'),
    sb.from('transactions').select('*,categories(name,emoji),accounts(name,emoji)').order('created_at',{ascending:false}).limit(15),
    sb.from('transactions').select('type,amount').gte('created_at',r.from).lte('created_at',r.to).in('type',['income','expense'])
  ]).then(function(res){
    var accs = res[0].data || [];
    var txs  = res[1].data || [];
    var mths = res[2].data || [];
    var bal = accs.reduce(function(s,a){ return s+Number(a.balance); },0);
    var inc = mths.filter(function(t){ return t.type==='income'; }).reduce(function(s,t){ return s+Number(t.amount); },0);
    var exp = mths.filter(function(t){ return t.type==='expense'; }).reduce(function(s,t){ return s+Number(t.amount); },0);
    var aHtml = '';
    accs.forEach(function(a){
      aHtml += '<div class="acard"><div class="ae">'+a.emoji+'</div><div class="an">'+a.name+'</div><div class="av">'+fmt(a.balance)+'</div></div>';
    });
    var tHtml = '';
    if (!txs.length) {
      tHtml = '<div class="empty"><i class="ti ti-receipt-off"></i>Транзакций пока нет</div>';
    } else {
      txs.forEach(function(t){
        var ic = t.type==='expense'?'r':'g';
        var sg = t.type==='expense'?'-':'+';
        var cl = t.type==='expense'?'neg':'pos';
        var ce = t.categories&&t.categories.emoji?t.categories.emoji:'📦';
        var cn = t.categories&&t.categories.name?t.categories.name:'—';
        var ae = t.accounts&&t.accounts.emoji?t.accounts.emoji:'';
        var an = t.accounts&&t.accounts.name?t.accounts.name:'—';
        var com = t.comment?'<div class="txic2">💬 '+t.comment+'</div>':'';
        tHtml += '<div class="txi">'+
          '<div class="txic '+ic+'">'+ce+'</div>'+
          '<div class="txif"><div class="txin">'+cn+'</div><div class="txim">'+ae+' '+an+' · '+fmtD(t.created_at)+'</div>'+com+'</div>'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<div class="txa '+cl+'">'+sg+fmt(t.amount)+'</div>'+
            '<button class="delbtn" onclick="delTx('+t.id+','+t.account_id+','+t.amount+',"'+t.type+'")"><i class="ti ti-trash" style="font-size:15px"></i></button>'+
          '</div>'+
        '</div>';
      });
    }
    el.innerHTML =
      '<div class="bal">'+
        '<div class="bal-l">Общий баланс</div>'+
        '<div class="bal-n">'+fmt(bal)+'</div>'+
        '<div class="bal-row">'+
          '<div class="bal-s"><div class="bal-sl">Доходы (месяц)</div><div class="bal-sv">+'+fmt(inc)+'</div></div>'+
          '<div class="bal-s"><div class="bal-sl">Расходы (месяц)</div><div class="bal-sv">-'+fmt(exp)+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="qb">'+
        '<button class="qb-e" onclick="go(\'add\');setType(\'expense\')"><i class="ti ti-minus" style="font-size:15px"></i> Расход</button>'+
        '<button class="qb-i" onclick="go(\'add\');setType(\'income\')"><i class="ti ti-plus" style="font-size:15px"></i> Доход</button>'+
      '</div>'+

      '<div class="sec">Последние операции</div>'+
      '<div class="txl">'+tHtml+'</div>';
  });
}

function delTx(id, accId, amt, type) {
  if (!confirm('Удалить транзакцию?')) return;
  sb.from('accounts').select('balance').eq('id',accId).single().then(function(r){
    var nb = type==='expense' ? Number(r.data.balance)+Number(amt) : Number(r.data.balance)-Number(amt);
    return Promise.all([
      sb.from('transactions').delete().eq('id',id),
      sb.from('accounts').update({balance:nb}).eq('id',accId)
    ]);
  }).then(function(){ toast('🗑 Удалено'); loadHome(); });

// ── ADD ─────────────────────────────────────────────────
function loadAdd() {
  selCat=null; selAcc=null;
  document.getElementById('amtIn').value='';
  document.getElementById('comIn').value='';
  Promise.all([
    sb.from('categories').select('*').eq('type',txType).order('id'),

  ]).then(function(res){
    var cats = res[0].data||[];
    var accs = res[1].data||[];
    var ch='';
    cats.forEach(function(c){
      ch+='<div class="catr" data-id="'+c.id+'" data-nm="'+c.name+'" data-em="'+c.emoji+'" onclick="pickCat(this)">'+
        '<div class="catem">'+c.emoji+'</div><div class="catnm">'+c.name+'</div>'+
        '<i class="ti ti-circle-check catchk"></i></div>';
    });
    ch+='<div class="addcat" onclick="addCat()"><div class="addcati"><i class="ti ti-plus" style="font-size:17px;color:#fff"></i></div><div style="font-size:15px;color:var(--blue);font-weight:500">Добавить категорию</div></div>';

function pickCat(el) {
  document.querySelectorAll('.catr').forEach(function(r){ r.classList.remove('se','si'); });
  el.classList.add(txType==='expense'?'se':'si');
  selCat={id:el.dataset.id,name:el.dataset.nm,emoji:el.dataset.em};
}
function pickAcc(el) {
  document.querySelectorAll('.accr').forEach(function(r){ r.classList.remove('on'); });
  el.classList.add('on');
  selAcc=el.dataset.id;
}
function setType(t) {
  txType=t;
  document.getElementById('ttE').className='ttab'+(t==='expense'?' exp':'');
  document.getElementById('ttI').className='ttab'+(t==='income'?' inc':'');
  loadAdd();
}
function setCur(el,cur) {
  document.querySelectorAll('.cb').forEach(function(b){ b.classList.remove('on'); });
  el.classList.add('on');
  selCur=cur;
  var rb=document.getElementById('rateBox');
  var hl=document.getElementById('hintEl');
  var syms={EUR:'€',USD:'$',GBP:'£'};
  if (cur==='UAH') {
    rb.style.display='none'; hl.style.display='block'; hl.textContent='Сумма в гривнах';
  } else {
    hl.style.display='none'; rb.style.display='flex';
    document.getElementById('rateLabel').textContent='1 '+syms[cur]+' =';
    document.getElementById('rateIn').value='';
  }
}
function addCat() {
  var nm=prompt('Название категории:');
  if (!nm) return;
  sb.from('categories').insert({name:nm,emoji:'📦',type:txType}).then(function(){ toast('✅ Категория добавлена'); loadAdd(); });
}
function saveTx() {
  var amt=parseFloat(document.getElementById('amtIn').value);
  if (!amt||amt<=0){ toast('⚠️ Введи сумму'); return; }
  if (!selCat){ toast('⚠️ Выбери категорию'); return; }
  if (!selAcc){ toast('⚠️ Выбери счёт'); return; }
  var com=document.getElementById('comIn').value;
  var accId=parseInt(selAcc);
  var catId=parseInt(selCat.id);
  var finalAmt=amt;
  if (selCur!=='UAH') {
    var rate=parseFloat(document.getElementById('rateIn').value);
    if (!rate||rate<=0){ toast('⚠️ Введи курс валюты'); return; }
    finalAmt=Math.round(amt*rate*100)/100;
  }
  sb.from('transactions').insert({type:txType,amount:finalAmt,account_id:accId,category_id:catId,comment:com}).then(function(r){
    if (r.error){ toast('Ошибка сохранения'); return; }
    sb.from('accounts').select('balance').eq('id',accId).single().then(function(r2){
      var nb=txType==='expense'?Number(r2.data.balance)-finalAmt:Number(r2.data.balance)+finalAmt;
      sb.from('accounts').update({balance:nb}).eq('id',accId).then(function(){
        toast('✅ Сохранено!');
        document.getElementById('amtIn').value='';
        document.getElementById('comIn').value='';
        document.getElementById('rateIn').value='';
        selCat=null; selAcc=null;
        document.querySelectorAll('.catr').forEach(function(r){ r.classList.remove('se','si'); });
        document.querySelectorAll('.accr').forEach(function(r){ r.classList.remove('on'); });
      });
    });
  });
}

// ── STATS ───────────────────────────────────────────────
function loadStats() {
  var el=document.getElementById('statsEl');
  el.innerHTML='<div class="spin"></div>';
  var r=monthRange(statMonth);
  var lbl=statMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  sb.from('transactions').select('*,categories(name,emoji)').gte('created_at',r.from).lte('created_at',r.to).then(function(res){
    var txs=res.data||[];
    var exps=txs.filter(function(t){ return t.type==='expense'; });
    var incs=txs.filter(function(t){ return t.type==='income'; });
    var totE=exps.reduce(function(s,t){ return s+Number(t.amount); },0);
    var totI=incs.reduce(function(s,t){ return s+Number(t.amount); },0);
    var diff=totI-totE;
    var dCls=diff>=0?'pos':'neg';
    var byE={}, byI={};
    exps.forEach(function(t){
      var k=t.categories&&t.categories.name?t.categories.name:'Прочее';
      var em=t.categories&&t.categories.emoji?t.categories.emoji:'📦';
      if (!byE[k]) byE[k]={em:em,tot:0};
      byE[k].tot+=Number(t.amount);
    });
    incs.forEach(function(t){
      var k=t.categories&&t.categories.name?t.categories.name:'Прочее';
      var em=t.categories&&t.categories.emoji?t.categories.emoji:'📦';
      if (!byI[k]) byI[k]={em:em,tot:0};
      byI[k].tot+=Number(t.amount);
    });
    var sE=Object.entries(byE).sort(function(a,b){ return b[1].tot-a[1].tot; });
    var sI=Object.entries(byI).sort(function(a,b){ return b[1].tot-a[1].tot; });
    function catHtml(entries, total, type) {
      if (!entries.length) return '<div class="empty" style="padding:16px"><i class="ti ti-chart-pie-off"></i>Нет данных</div>';
      var h='';
      entries.forEach(function(e){
        var nm=e[0], em=e[1].em, tot=e[1].tot;
        var pct=total>0?Math.round(tot/total*100):0;
        var col=type==='expense'?'var(--red)':'var(--green)';
        var sgn=type==='expense'?'-':'+';
        h+='<div class="statcat" onclick="showCatDetail(\''+nm+'\',\''+em+'\',\''+type+'\',\''+r.from+'\',\''+r.to+'\')">'+
          '<div class="statcath">'+
            '<div class="statcatn">'+em+' '+nm+'</div>'+
            '<div style="display:flex;align-items:center;gap:6px">'+
              '<div class="statcatv" style="color:'+col+'">'+sgn+fmt(tot)+'</div>'+
              '<i class="ti ti-chevron-right" style="color:var(--muted);font-size:15px"></i>'+
            '</div>'+
          '</div>'+
          '<div class="barbg"><div class="barfill" style="width:'+pct+'%;background:'+col+'"></div></div>'+
          '<div style="font-size:11px;color:var(--muted);margin-top:4px">'+pct+'% от '+(type==='expense'?'расходов':'доходов')+'</div>'+
        '</div>';
      });
      return h;
    }
    el.innerHTML=
      '<div class="statnav">'+
        '<button class="statnb" onclick="chMonth(-1)"><i class="ti ti-chevron-left"></i></button>'+
        '<div class="statlbl">'+lbl+'</div>'+
        '<button class="statnb" onclick="chMonth(1)"><i class="ti ti-chevron-right"></i></button>'+
      '</div>'+
      '<div class="statsum">'+
        '<div class="statsc"><div class="statsl">Доходы</div><div class="statsv pos">+'+fmt(totI)+'</div></div>'+
        '<div class="statsc"><div class="statsl">Расходы</div><div class="statsv neg">-'+fmt(totE)+'</div></div>'+
        '<div class="statsc"><div class="statsl">Итог</div><div class="statsv '+dCls+'">'+(diff>=0?'+':'')+fmt(diff)+'</div></div>'+
      '</div>'+
      '<div class="sec" style="margin-top:4px">🔴 Расходы по категориям</div>'+catHtml(sE,totE,'expense')+
      '<div class="sec" style="margin-top:12px">🟢 Доходы по категориям</div>'+catHtml(sI,totI,'income');
  });
}
function chMonth(d){ statMonth.setMonth(statMonth.getMonth()+d); loadStats(); }

function showCatDetail(nm, em, type, from, to) {

    .eq('type',type).gte('created_at',from).lte('created_at',to).order('created_at',{ascending:false})
    .then(function(r){
      var filtered=(r.data||[]).filter(function(t){ return t.categories&&t.categories.name===nm; });
      var total=filtered.reduce(function(s,t){ return s+Number(t.amount); },0);
      var col=type==='expense'?'var(--red)':'var(--green)';

      var rows='';

        rows='<div class="empty"><i class="ti ti-receipt-off"></i>Нет записей</div>';
      } else {
        filtered.forEach(function(t){

          var an=t.accounts&&t.accounts.name?t.accounts.name:'—';
          rows+='<div style="background:#f8f8f8;border-radius:12px;padding:12px;margin-bottom:8px">'+
            '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
              '<div style="font-size:15px;font-weight:600;color:'+col+'">'+sgn+fmt(t.amount)+'</div>'+
              '<div style="font-size:11px;color:var(--muted)">'+fmtD(t.created_at)+'</div>'+
            '</div>'+
            '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">'+ae+' '+an+'</div>'+
            '<div style="font-size:13px;padding:6px 8px;background:#fff;border-radius:8px;border-left:3px solid '+col+'">'+
              (t.comment?t.comment:'<span style="color:var(--muted)">Без комментария</span>')+
            '</div>'+

      '</div>'+
      '<div class="sec">Записей: '+filtered.length+'</div>'+rows;
      showModal(em+' '+nm, h);
    });
}

// ── HISTORY ─────────────────────────────────────────────
function loadHist(reset) {
  if (reset){ histOffset=0; histDone=false; }
  var el=document.getElementById('histEl');
  if (reset) el.innerHTML='<div class="spin"></div>';
  var q=sb.from('transactions').select('*,categories(name,emoji),accounts(name,emoji)')
    .order('created_at',{ascending:false}).range(histOffset,histOffset+histLimit-1);
  if (histFilter==='expense') q=q.eq('type','expense');
  else if (histFilter==='income') q=q.eq('type','income');
  q.then(function(r){
    var txs=r.data||[];
    if (txs.length<histLimit) histDone=true;
    var rows='';
    txs.forEach(function(t){
      var ic=t.type==='expense'?'r':'g';
      var sg=t.type==='expense'?'-':'+';
      var cl=t.type==='expense'?'neg':'pos';
      var ce=t.categories&&t.categories.emoji?t.categories.emoji:'📦';
      var cn=t.categories&&t.categories.name?t.categories.name:'—';
      var ae=t.accounts&&t.accounts.emoji?t.accounts.emoji:'';
      var an=t.accounts&&t.accounts.name?t.accounts.name:'—';
      var com=t.comment?'<div class="txic2">💬 '+t.comment+'</div>':'';
      rows+='<div class="txi">'+
        '<div class="txic '+ic+'">'+ce+'</div>'+
        '<div class="txif"><div class="txin">'+cn+'</div><div class="txim">'+ae+' '+an+' · '+fmtD(t.created_at)+'</div>'+com+'</div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
          '<div class="txa '+cl+'">'+sg+fmt(t.amount)+'</div>'+
          '<button class="delbtn" onclick="delTxH('+t.id+','+t.account_id+','+t.amount+',"'+t.type+'")"><i class="ti ti-trash" style="font-size:15px"></i></button>'+
        '</div>'+
      '</div>';
    });
    var more=histDone?'':'<button class="morebtn" onclick="moreHist()">Загрузить ещё</button>';
    var eCls={'all':'all-on','expense':'exp-on','income':'inc-on'};
    var fil='<div class="hfil">'+
      '<button class="hfbtn '+(histFilter==='all'?'all-on':'')+'" onclick="setHF(\'all\')">Все</button>'+
      '<button class="hfbtn '+(histFilter==='expense'?'exp-on':'')+'" onclick="setHF(\'expense\')">Расходы</button>'+
      '<button class="hfbtn '+(histFilter==='income'?'inc-on':'')+'" onclick="setHF(\'income\')">Доходы</button>'+
    '</div>';
    if (reset) {
      el.innerHTML=fil+'<div class="txl" id="histList">'+rows+'</div>'+more;
    } else {
      var list=document.getElementById('histList');
      if (list) list.innerHTML+=rows;
      var old=el.querySelector('.morebtn');
      if (old) old.remove();
      if (more) el.insertAdjacentHTML('beforeend',more);
    }
  });
}
function moreHist(){ histOffset+=histLimit; loadHist(false); }
function setHF(f){ histFilter=f; loadHist(true); }
function delTxH(id,accId,amt,type) {
  if (!confirm('Удалить транзакцию?')) return;
  sb.from('accounts').select('balance').eq('id',accId).single().then(function(r){
    var nb=type==='expense'?Number(r.data.balance)+Number(amt):Number(r.data.balance)-Number(amt);
    return Promise.all([sb.from('transactions').delete().eq('id',id),sb.from('accounts').update({balance:nb}).eq('id',accId)]);
  }).then(function(){ toast('🗑 Удалено'); loadHist(true); });
}

// ── SAVINGS ─────────────────────────────────────────────
function loadSav() {
  var el=document.getElementById('savEl');
  el.innerHTML='<div class="spin"></div>';
  var now=new Date();
  var r=monthRange(now);
  Promise.all([
    sb.from('savings_goals').select('*').order('created_at'),
    sb.from('transactions').select('type,amount').gte('created_at',r.from).lte('created_at',r.to).in('type',['income','expense'])
  ]).then(function(res){
    var goals=res[0].data||[];
    var mths=res[1].data||[];
    var totSaved=goals.reduce(function(s,g){ return s+Number(g.current_amount); },0);
    var mI=mths.filter(function(t){ return t.type==='income'; }).reduce(function(s,t){ return s+Number(t.amount); },0);
    var mE=mths.filter(function(t){ return t.type==='expense'; }).reduce(function(s,t){ return s+Number(t.amount); },0);
    var surplus=mI-mE;
    var sPos=surplus>=0;
    var sCol=sPos?'var(--green)':'var(--red)';
    var sBg=sPos?'#F0FFF4':'#FFF0F0';
    var sBtn=sPos
      ? '<button onclick="openDistribute('+surplus+')" style="background:var(--purple);color:#fff;border:none;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer">Распределить →</button>'
      : '<button onclick="openDeduct('+Math.abs(surplus)+')" style="background:var(--red);color:#fff;border:none;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer">Списать с цели →</button>';
    var surpHtml='<div class="surpcard" style="background:'+sBg+';border:1.5px solid '+sCol+'20">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div>'+
          '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Остаток за '+now.toLocaleDateString('ru-RU',{month:'long'})+'</div>'+
          '<div style="font-size:22px;font-weight:700;color:'+sCol+'">'+(sPos?'+':'')+fmt(surplus)+'</div>'+
        '</div>'+sBtn+
      '</div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:8px">'+
        (sPos?'Разложи остаток по целям накоплений':'Расходы превысили доходы — можно списать разницу с накоплений')+
      '</div>'+
    '</div>';
    var gHtml='';
    if (!goals.length) {
      gHtml='<div class="empty"><i class="ti ti-piggy-bank"></i>Нет целей. Добавь первую!</div>';
    } else {
      goals.forEach(function(g){
        var pct=g.target_amount>0?Math.min(100,Math.round(g.current_amount/g.target_amount*100)):0;
        var bc=pct>=100?'var(--green)':pct>=50?'var(--blue)':'var(--purple)';
        gHtml+='<div class="goalc">'+
          '<div class="goalh">'+
            '<div class="goalem">'+g.emoji+'</div>'+
            '<div class="goali"><div class="goalnm">'+g.name+'</div><div class="goalpt">'+fmt(g.current_amount)+' / '+fmt(g.target_amount)+'</div></div>'+
            '<div class="goalpct" style="color:'+bc+'">'+(pct>=100?'✅':pct+'%')+'</div>'+
          '</div>'+
          '<div class="goalbar"><div class="goalbf" style="width:'+pct+'%;background:'+bc+'"></div></div>'+
          '<div class="goalacts">'+
            '<button class="gbtn gbtn-a" onclick="topup('+g.id+',\''+g.name+'\','+g.current_amount+')">+ Пополнить</button>'+
            '<button class="gbtn gbtn-t" onclick="takeGoal('+g.id+',\''+g.name+'\','+g.current_amount+')">− Снять</button>'+
          '</div>'+
        '</div>';
      });
    }
    cmGoals=goals; cmSurplus=surplus;
    el.innerHTML=
      '<div class="savhero"><div class="savhl">Всего накоплено</div><div class="savhn">'+fmt(totSaved)+'</div><div class="savhs">Активных целей: '+goals.length+'</div></div>'+
      surpHtml+
      '<div class="sec">Мои цели</div>'+gHtml+
      '<button class="addgoal" onclick="addGoal()"><i class="ti ti-plus"></i> Добавить цель</button>';
  });
}

function addGoal() {
  var nm=prompt('Название цели:'); if (!nm) return;
  var em=prompt('Эмодзи (🚗 🏖️ 💻 🎯):')||'🎯';
  var tgt=parseFloat(prompt('Целевая сумма (грн):')); if (!tgt||tgt<=0){ toast('Введи сумму'); return; }
  sb.from('savings_goals').insert({name:nm,emoji:em,target_amount:tgt,current_amount:0}).then(function(){ toast('✅ Цель добавлена!'); loadSav(); });
}

function showAccPicker(title, cb) {
  sb.from('accounts').select('*').order('id').then(function(r){
    var h='';
    (r.data||[]).forEach(function(a){
      h+='<div class="marc" onclick="mpick('+a.id+')">'+
        '<span style="font-size:22px">'+a.emoji+'</span>'+
        '<div style="flex:1"><div style="font-size:14px;font-weight:500">'+a.name+'</div><div style="font-size:12px;color:var(--muted)">'+fmt(a.balance)+'</div></div>'+
        '<i class="ti ti-chevron-right" style="color:var(--muted)"></i></div>';
    });
    showModal(title, h, cb);
  });
}

function topup(goalId, goalName, curAmt) {
  var amt=parseFloat(prompt('Сколько положить в "'+goalName+'" (грн)?'));
  if (!amt||amt<=0) return;
  showAccPicker('С какого счёта?', function(accId){
    sb.from('accounts').select('balance').eq('id',accId).single().then(function(r){
      if (Number(r.data.balance)<amt){ toast('⚠️ Недостаточно средств'); return; }
      Promise.all([
        sb.from('savings_goals').update({current_amount:curAmt+amt}).eq('id',goalId),
        sb.from('accounts').update({balance:Number(r.data.balance)-amt}).eq('id',accId),
        sb.from('transactions').insert({type:'savings_in',amount:amt,account_id:accId,savings_goal_id:goalId,comment:'Пополнение: '+goalName})
      ]).then(function(){ toast('✅ '+fmt(amt)+' → '+goalName); loadSav(); });
    });
  });
}

function takeGoal(goalId, goalName, curAmt) {
  var amt=parseFloat(prompt('Сколько снять из "'+goalName+'" (грн)?'));
  if (!amt||amt<=0) return;
  if (curAmt<amt){ toast('⚠️ Недостаточно в накоплениях'); return; }
  showAccPicker('На какой счёт?', function(accId){
    sb.from('accounts').select('balance').eq('id',accId).single().then(function(r){
      Promise.all([
        sb.from('savings_goals').update({current_amount:curAmt-amt}).eq('id',goalId),
        sb.from('accounts').update({balance:Number(r.data.balance)+amt}).eq('id',accId),
        sb.from('transactions').insert({type:'savings_out',amount:amt,account_id:accId,savings_goal_id:goalId,comment:'Снятие: '+goalName})
      ]).then(function(){ toast('✅ '+fmt(amt)+' ← '+goalName); loadSav(); });
    });
  });
}

// Распределить остаток по целям (плюс)
function openDistribute(surplus) {
  var goals=cmGoals||[];
  if (!goals.length){ toast('Сначала добавь цели'); return; }
  var h='<div style="background:#F0FFF4;border-radius:12px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">'+
    '<div style="font-size:14px;color:var(--green);font-weight:500">Доступно для распределения</div>'+
    '<div style="font-size:18px;font-weight:700;color:var(--green)" id="dleft">+'+fmt(surplus)+'</div>'+
  '</div>';
  goals.forEach(function(g){
    var rem=Math.max(0,Number(g.target_amount)-Number(g.current_amount));
    h+='<div style="background:#f8f8f8;border-radius:12px;padding:12px;margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'+
        '<div style="font-size:14px;font-weight:500">'+g.emoji+' '+g.name+'</div>'+
        '<div style="font-size:11px;color:var(--muted)">нужно '+fmt(rem)+'</div>'+
      '</div>'+
      '<input type="number" id="di_'+g.id+'" placeholder="0" oninput="updLeft('+surplus+')" style="width:100%;border:1.5px solid #ddd;border-radius:8px;padding:8px;font-size:14px;outline:none">'+
    '</div>';
  });
  h+='<div id="dwarn" style="color:var(--red);font-size:13px;margin-bottom:10px;display:none">⚠️ Превышает доступную сумму</div>'+
    '<button onclick="confirmDist('+surplus+')" style="width:100%;background:var(--purple);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer">Распределить →</button>';
  showModal('Распределить '+fmt(surplus), h);
}

function updLeft(surplus) {
  var tot=0;
  document.querySelectorAll('[id^="di_"]').forEach(function(i){ tot+=parseFloat(i.value)||0; });
  var left=surplus-tot;
  var el=document.getElementById('dleft');
  if (el){ el.textContent=(left>=0?'+':'')+fmt(left); el.style.color=left>=0?'var(--green)':'var(--red)'; }
  var w=document.getElementById('dwarn');
  if (w) w.style.display=left<0?'block':'none';
}

function confirmDist(surplus) {
  var goals=cmGoals||[];
  var tot=0, dists=[];
  goals.forEach(function(g){
    var v=parseFloat(document.getElementById('di_'+g.id)&&document.getElementById('di_'+g.id).value)||0;
    if (v>0){ dists.push({goal:g,amt:v}); tot+=v; }
  });
  if (tot>surplus){ toast('⚠️ Превышает остаток'); return; }
  if (!dists.length){ closeModal(); return; }
  sb.from('accounts').select('*').order('id').then(function(r){
    var accs=r.data||[];
    var card=accs.find(function(a){ return a.name==='Карта'; })||accs[0];
    var ps=[];
    dists.forEach(function(d){
      ps.push(sb.from('savings_goals').update({current_amount:Number(d.goal.current_amount)+d.amt}).eq('id',d.goal.id));
      ps.push(sb.from('transactions').insert({type:'savings_in',amount:d.amt,account_id:card.id,savings_goal_id:d.goal.id,comment:'Закрытие месяца → '+d.goal.name}));
    });
    ps.push(sb.from('accounts').update({balance:Number(card.balance)-tot}).eq('id',card.id));
    return Promise.all(ps);
  }).then(function(){ closeModal(); toast('✅ '+fmt(tot)+' распределено!'); loadSav(); });
}

// Списать дефицит с накоплений (минус)
function openDeduct(deficit) {
  var goals=cmGoals||[];
  if (!goals.length){ toast('Нет накоплений для списания'); return; }
  var h='<div style="background:#FFF0F0;border-radius:12px;padding:12px;margin-bottom:14px">'+
    '<div style="font-size:14px;color:var(--red);font-weight:500;margin-bottom:4px">Дефицит за месяц</div>'+
    '<div style="font-size:20px;font-weight:700;color:var(--red)">-'+fmt(deficit)+'</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:6px">Выбери цель, с которой списать недостаток</div>'+
  '</div>';
  goals.forEach(function(g){
    if (Number(g.current_amount)<=0) return;
    h+='<div class="marc" onclick="confirmDeduct('+g.id+',\''+g.name+'\','+g.current_amount+','+deficit+')">'+
      '<span style="font-size:24px">'+g.emoji+'</span>'+
      '<div style="flex:1">'+
        '<div style="font-size:14px;font-weight:500">'+g.name+'</div>'+
        '<div style="font-size:12px;color:var(--muted)">Накоплено: '+fmt(g.current_amount)+'</div>'+
      '</div>'+
      '<i class="ti ti-chevron-right" style="color:var(--muted)"></i>'+
    '</div>';
  });
  showModal('Списать дефицит', h);
}

function confirmDeduct(goalId, goalName, curAmt, deficit) {
  closeModal();
  var toDeduct=Math.min(deficit, curAmt);
  sb.from('accounts').select('*').order('id').then(function(r){
    var accs=r.data||[];
    var card=accs.find(function(a){ return a.name==='Карта'; })||accs[0];
    return Promise.all([
      sb.from('savings_goals').update({current_amount:curAmt-toDeduct}).eq('id',goalId),
      sb.from('accounts').update({balance:Number(card.balance)+toDeduct}).eq('id',card.id),
      sb.from('transactions').insert({type:'savings_out',amount:toDeduct,account_id:card.id,savings_goal_id:goalId,comment:'Покрытие дефицита из: '+goalName})
    ]);
  }).then(function(){ toast('✅ '+fmt(toDeduct)+' списано из '+goalName); loadSav(); });
}

if (checkAuth()) loadHome();
</script>
